<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Details</title>
</head>
<body>
    <p >Step 1: Please enter your personal details below.</p>

    <form action="education.html">

        <label for="">Full Name :- </label>
        <input type="text" placeholder="Enter Your full name">
        <br><br>

        <label for="">Father Name :- </label>
        <input type="text" placeholder="Enter Your Father name" >
        <br><br>

        <label for="">Mother Name :- </label>
        <input type="text" placeholder="Enter Your Mother name" >
        <br><br>


        <label for="">Gender :- </label>
        <input type="radio" name="gender" value="Male">Male
        <input type="radio" name="gender" value="Female">Female
         <input type="radio" name="gender" value="other">other
        <br><br>

        <label for="">DOB :- </label>
        <input type="date" required>
        <br><br>

        <label for="">Phone</label>
        <input type="tel" placeholder="Enter your number" required>
        <br><br>


        <a href="./all_detail.html"><button type="button">Back</button></a>
        <button type="submit">Next</button>
        

        


    </form>
